# Hosted deployment on a single GCP VM. Lives in /srv/semestra/app on the VM (see GCP-SETUP.md).
# Always deploy through ./deploy.sh so the image tag in .env and the rollback logic stay in sync.
name: semestra

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  api:
    image: ghcr.io/jinyuanzhou-leo/semestra-api:${SEMESTRA_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Only reachable from Caddy over the private compose network.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - /srv/semestra/data:/data
    expose:
      - "8000"
    logging: *logging

  # Optional second stack for Vercel previews: `docker compose --profile staging up -d`.
  api-staging:
    profiles: [staging]
    image: ghcr.io/jinyuanzhou-leo/semestra-api:${SEMESTRA_STAGING_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.staging
        required: false
    environment:
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - /srv/semestra/data-staging:/data
    expose:
      - "8000"
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.semestra.jyleo.cc}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Continuous replication of the SQLite databases to GCS. Credentials come from the VM's
  # service account (metadata server); there is no key file anywhere.
  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    environment:
      BACKUP_BUCKET: ${BACKUP_BUCKET:?set BACKUP_BUCKET in .env}
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - /srv/semestra/data:/data
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
