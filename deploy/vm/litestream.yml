# Continuous replication of the SQLite databases to GCS (/etc/litestream.yml on the VM).
# ${BACKUP_BUCKET} comes from /etc/semestra/backup.env; credentials from the VM's service account.
dbs:
  - path: /var/lib/semestra/semestra.db
    replicas:
      - type: gcs
        bucket: ${BACKUP_BUCKET}
        path: litestream/semestra
        sync-interval: 1s
        snapshot-interval: 24h
        retention: 720h # 30 days

  - path: /var/lib/semestra/agent_checkpoints.sqlite
    replicas:
      - type: gcs
        bucket: ${BACKUP_BUCKET}
        path: litestream/agent_checkpoints
        sync-interval: 10s
        snapshot-interval: 24h
        retention: 720h
