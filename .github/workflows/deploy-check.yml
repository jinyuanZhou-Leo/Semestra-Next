name: Deploy check
# Everything under deploy/ must keep working: configs parse, scripts pass shellcheck, the images
# build, start as a non-root user, migrate, and survive a restart without regenerating secrets.
# Nothing is deployed yet, so it only runs when the files it checks change; start it by hand from
# the Actions tab to check the images against app changes.
on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - .dockerignore
      - .github/workflows/**
      # Inputs of the edge image that can break its build.
      - apps/site/package.json
      - apps/site/astro.config.mjs
      - apps/docs/package.json
      - apps/docs/next.config.*
      - apps/docs/src/components/mcp-catalog.tsx
  # Draft PRs skip this; marking the PR ready for review runs it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - deploy/**
      - .dockerignore
      - .github/workflows/**
      # Inputs of the edge image that can break its build.
      - apps/site/package.json
      - apps/site/astro.config.mjs
      - apps/docs/package.json
      - apps/docs/next.config.*
      - apps/docs/src/components/mcp-catalog.tsx
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck deploy/docker/entrypoint.sh deploy/hosted/deploy.sh deploy/hosted/bootstrap-vm.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
      - name: Compose files
        run: |
          cp deploy/hosted/.env.example deploy/hosted/.env
          sed -i 's/^ACME_EMAIL=$/ACME_EMAIL=ci@example.com/' deploy/hosted/.env
          docker compose --project-directory deploy/hosted -f deploy/hosted/docker-compose.yml --profile staging config -q
          cp deploy/selfhost/.env.example deploy/selfhost/.env
          docker compose --project-directory deploy/selfhost -f deploy/selfhost/docker-compose.yml config -q
          docker compose --project-directory deploy/selfhost -f deploy/selfhost/docker-compose.yml \
            --profile https --profile ai-local config -q
      - name: Caddyfiles
        run: |
          cp deploy/hosted/conf.d/staging.caddy.example deploy/hosted/conf.d/staging.caddy
          docker run --rm -e ACME_EMAIL=ci@example.com -e SEMESTRA_DOMAIN=semestra.example.com \
            -v "$PWD/deploy/hosted/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/hosted/conf.d:/etc/caddy/conf.d:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e SEMESTRA_DOMAIN=semestra.example.com \
            -v "$PWD/deploy/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: JSON configs
        run: |
          jq empty deploy/hosted/gcs-lifecycle.json

  images:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: api
          load: true
          tags: semestra-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: allinone
          load: true
          tags: semestra-allinone:ci
          cache-from: type=gha,scope=allinone
          cache-to: type=gha,scope=allinone,mode=max,ignore-error=true

      - name: API image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id semestra-api:ci -u)" = 10001

      - name: API image refuses to start in prod without keys
        run: |
          if docker run --rm semestra-api:ci 2>&1 | grep -q "must be set in prod"; then exit 0; fi
          echo "::error::expected the prod settings validator to stop the container"
          exit 1

      - name: API image bootstraps secrets, migrates and serves
        run: |
          docker volume create semestra-ci-data
          docker run -d --name api -p 8000:8000 -v semestra-ci-data:/data \
            -e SEMESTRA_AUTO_SECRETS=true semestra-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          test "$(docker exec api stat -c '%a' /data/secrets.env)" = 600
          before="$(docker exec api sha256sum /data/secrets.env)"
          docker exec api semestra backup /data/backups --db-only
          docker exec api sh -c 'ls /data/backups/db/semestra-*.sqlite'
          docker restart api
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          test "$before" = "$(docker exec api sha256sum /data/secrets.env)"
          docker rm -f api

      - name: All-in-one image serves the web app from the same origin
        run: |
          docker run -d --name allinone -p 8001:8000 -e SEMESTRA_AUTO_SECRETS=true semestra-allinone:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8001/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8001/healthz
          curl -fsS -H 'Accept: text/html' http://localhost:8001/p/some/deep/link | grep -qi '<div id="root">'
          asset="$(curl -fsS -H 'Accept: text/html' http://localhost:8001/ | grep -o '/assets/[^"]*\.js' | head -n 1)"
          curl -fsSI "http://localhost:8001${asset}" | grep -i 'cache-control: .*immutable'
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://localhost:8001/definitely-missing)"
          test "$code" = 404
          docker rm -f allinone

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: edge
          load: true
          tags: semestra-edge:ci
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max,ignore-error=true

      - name: Edge image routes the landing page, the docs and the app
        run: |
          docker network create semestra-ci
          docker run -d --name api --network semestra-ci -e SEMESTRA_AUTO_SECRETS=true semestra-allinone:ci
          for _ in $(seq 1 30); do
            if docker exec api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"; then break; fi
            sleep 2
          done
          docker run -d --name edge --network semestra-ci -p 8080:80 \
            -e ACME_EMAIL=ci@example.com -e SEMESTRA_DOMAIN=http://localhost \
            -v "$PWD/deploy/hosted/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/hosted/conf.d:/etc/caddy/conf.d:ro" semestra-edge:ci
          sleep 3
          base=http://localhost:8080
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "$base/")" = "$base/landing/"
          curl -fsS "$base/landing/" | grep -q '<html lang="en"'
          curl -fsS "$base/landing/zh/" | grep -q '<html lang="zh-CN"'
          curl -fsS "$base/docs/en" | grep -qi '<html'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/docs/en/definitely-missing")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/landing/definitely-missing")" = 404
          curl -s "$base/landing/definitely-missing" | grep -q 'Page not found'
          curl -fsSI "$base/landing/" | grep -qi '^cache-control: public, max-age=0, must-revalidate'
          curl -fsSI "$base/docs/en" | grep -qi '^cache-control: public, max-age=0, must-revalidate'
          curl -fsS -b semestra_session=x -H 'Accept: text/html' "$base/" | grep -qi '<div id="root">'
          curl -fsS -H 'Accept: text/html' "$base/login" | grep -qi '<div id="root">'
          curl -fsS "$base/readyz"
          docker rm -f edge api

      - name: Logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs allinone || true
          docker logs edge || true

  # The default self-hosted image. Releases build it for arm64 too; amd64 is enough to catch a
  # broken build, a missing system library or a model download that no longer works.
  ocr-image:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: allinone-ocr
          platforms: linux/amd64
          load: true
          tags: semestra-allinone:ci-ocr
          cache-from: type=gha,scope=allinone-ocr
          cache-to: type=gha,scope=allinone-ocr,mode=max,ignore-error=true

      - name: Image size
        run: docker image ls semestra-allinone:ci-ocr

      # The image has no model (each one downloads at run time, into the data volume): it serves,
      # PaddleOCR and onnxruntime load, and every model users can pick is still on Hugging Face,
      # the download source with known sizes. Nothing is downloaded here.
      - name: Serves, loads PaddleOCR and finds every model
        run: |
          docker run -d --name ocr -e SEMESTRA_AUTO_SECRETS=true semestra-allinone:ci-ocr
          for _ in $(seq 1 60); do
            if docker exec ocr python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"; then break; fi
            sleep 2
          done
          docker exec ocr python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
          test "$(docker exec ocr id -u)" = 10001
          docker exec ocr sh -c 'test ! -d "$PADDLE_PDX_CACHE_HOME/official_models"'
          docker exec ocr python -c "
          import onnxruntime, paddleocr
          from huggingface_hub import HfApi
          from semestra.modules.ai import local_ocr
          assert local_ocr._installed()
          api = HfApi()
          for model in local_ocr.MODELS:
              for part in local_ocr._parts(model):
                  info = api.model_info(f'PaddlePaddle/{part}', files_metadata=True)
                  size = sum(s.size or 0 for s in info.siblings or [])
                  assert size, part
                  print(part, size // 1_000_000, 'MB')
          "
          docker rm -f ocr

      - name: Logs on failure
        if: failure()
        run: docker logs ocr || true
