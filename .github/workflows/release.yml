name: Release
# A tag v* builds the self-hosting images and creates the GitHub Release. Normally
# `version.yml` creates the tag after the version PR merges and calls this workflow (a tag pushed
# with GITHUB_TOKEN does not trigger `push`); pushing a tag by hand still works.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, e.g. v1.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: semestra-api, target: api, suffix: "" }
          - { image: semestra-api, target: api-office, suffix: "-office" }
          - { image: semestra-allinone, target: allinone, suffix: "" }
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, ref: "refs/tags/${{ env.TAG }}" }
      - name: Tag must look like vMAJOR.MINOR.PATCH[-pre] and be on main
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${TAG#v}"
          ref="ghcr.io/${owner}/${{ matrix.image }}"
          {
            echo "tags<<EOF"
            echo "${ref}:${version}${{ matrix.suffix }}"
            # Pre-releases (v1.2.0-rc1) never move "latest".
            if [[ "$version" != *-* ]]; then echo "${ref}:latest${{ matrix.suffix }}"; fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max,ignore-error=true

  github-release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-node@v6
        with: { node-version: 26 }
      # The notes come from release-notes/<version>.json; tags without one (hand-made) fall back
      # to GitHub's generated list of PRs.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --title "Semestra ${TAG#v}")
          if [[ -f "release-notes/${TAG#v}.json" ]]; then
            node scripts/release.mjs notes "$TAG" >notes.md
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
