name: Version
# On every push to main: while changesets are pending, keep the "Version Packages" PR up to date
# (new version numbers, release-notes/<version>.json, CHANGELOG.md). Once that PR is merged there
# are no changesets left, so this tags v<version> and runs the release workflow. See
# .changeset/README.md.
on:
  push: { branches: [main] }
  # Run by hand right before merging an old version PR to refresh its release date.
  workflow_dispatch:

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      # `uv version` updates apps/api/pyproject.toml and uv.lock to the new version, and the
      # OpenAPI export (which carries the version) needs the backend installed.
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile --filter .
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm release:version
          pr-title: Release (version packages)
          commit-message: "chore: version packages"
        env:
          # The release date in release-notes/<version>.json is a calendar day in this zone.
          RELEASE_TIMEZONE: America/Toronto

  # Its own job with a fresh checkout of the pushed commit: changesets/action leaves the version
  # PR's changes in the working tree above, which would make `tag` see the next version early.
  # Runs on every push: `tag` does nothing unless this commit's version has release notes and no
  # tag yet. (`has-changesets` stays true while only empty changesets are pending, so gating on
  # it could skip a release for good.)
  tag:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.sha }}" }
      - uses: actions/setup-node@v6
        with: { node-version: 26 }
      - id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs tag

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
