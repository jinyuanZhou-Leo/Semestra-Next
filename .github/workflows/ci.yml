name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: test "$(uv run alembic heads | grep -c '(head)')" -le 1
      - run: uv run alembic upgrade head && uv run alembic check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @semestra/web lint
      - run: pnpm --filter @semestra/web typecheck
      - run: pnpm --filter @semestra/web test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project apps/api
      - run: pnpm gen:api
      - run: git diff --exit-code
