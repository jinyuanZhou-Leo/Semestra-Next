name: CI
on:
  push: { branches: [main] }
  # Draft PRs skip CI; marking the PR ready for review (ready_for_review) runs it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below have work to do, so a web-only change skips the API job and so on.
  # Skipped jobs report success, so they never block a merge.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      contract: ${{ steps.filter.outputs.contract }}
      docs: ${{ steps.filter.outputs.docs }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - .github/scripts/affected_tests.py
            api:
              - *ci
              - apps/api/**
              # tests/test_settings_messages.py and the agent tests read the message files.
              - apps/web/messages/**
            web:
              - *ci
              - apps/web/**
              - release-notes/**
              - .changeset/areas.json
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            contract:
              - *ci
              - apps/api/**
              - packages/api-client/**
              - package.json
              - pnpm-lock.yaml
            # The docs build reads the OpenAPI schema and the MCP catalog. It also reads the app's
            # capability titles, but falls back to the names, so message changes can't break it.
            docs:
              - *ci
              - apps/docs/**
              - release-notes/**
              - .changeset/areas.json
              - packages/api-client/openapi.json
              - packages/api-client/capabilities.json
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            site:
              - *ci
              - apps/site/**
              - pnpm-lock.yaml

  # Every PR that touches an app or package carries a changeset (`pnpm changeset`, or
  # `pnpm changeset --empty` for internal changes) with an English and a Chinese note.
  # The version PR (branch changeset-release/*) consumes the changesets, so it is exempt.
  changeset:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter .
      - run: pnpm exec changeset status --since="origin/${{ github.base_ref }}"
      - run: pnpm release:check
      - run: node --test scripts/release.test.mjs

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v6
        # The PR merge commit and its base, so affected_tests.py can diff them.
        with: { fetch-depth: 2 }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      # PRs run the tests of the modules they touch (see the script); main runs everything.
      - name: pytest
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tests=all
          if [ "$EVENT" = pull_request ]; then
            tests=$(uv run python ../../.github/scripts/affected_tests.py api --base HEAD^1) || tests=all
          fi
          echo "Selected: $tests"
          if [ "$tests" = all ]; then uv run pytest -q -n auto
          elif [ "$tests" != none ]; then read -ra paths <<< "$tests"; uv run pytest -q -n auto "${paths[@]}"
          fi
      - run: test "$(uv run alembic heads | grep -c '(head)')" -le 1
      - run: uv run alembic upgrade head && uv run alembic check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@semestra/web..."
      - run: pnpm --filter @semestra/web lint
      - run: pnpm --filter @semestra/web typecheck
      # PRs run the tests that import the changed files (`vitest related`); main runs everything.
      - name: vitest
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tests=all
          if [ "$EVENT" = pull_request ]; then
            tests=$(python3 .github/scripts/affected_tests.py web --base HEAD^1) || tests=all
          fi
          echo "Selected: $tests"
          if [ "$tests" = all ]; then pnpm --filter @semestra/web test
          elif [ "$tests" != none ]; then read -ra paths <<< "$tests"; pnpm --filter @semestra/web test:related "${paths[@]}"
          fi

  # The marketing site (apps/site): lint, type-check and a static build.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/site } }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@semestra/site..."
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@semestra/web..."
      - run: uv sync --locked --project apps/api
      - run: pnpm gen:api
      - run: git diff --exit-code

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@semestra/docs..."
      - run: pnpm --filter @semestra/docs lint
      - run: pnpm --filter @semestra/docs typecheck
      - run: pnpm --filter @semestra/docs build
