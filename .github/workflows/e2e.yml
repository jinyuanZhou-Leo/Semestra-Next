name: E2E
# Playwright through the main flows (sign-up, onboarding, ICS import) against the API serving the
# built SPA on one origin, as the all-in-one image does. Runs on the version PR, so each release is
# checked before it ships (the PR's runs wait for approval like CI's), and by hand from the
# Actions tab on any branch.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --project apps/api
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@semestra/web..."
      # Same origin: the SPA calls the API that serves it.
      - run: pnpm --filter @semestra/web build
        env:
          VITE_API_ORIGIN: ""
      - run: pnpm --filter @semestra/web exec playwright install --with-deps chromium
      - run: pnpm --filter @semestra/web e2e
        env:
          E2E_BUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
