name: E2E
# Playwright smoke test against the all-in-one image, i.e. what a self-hoster runs.
# Started by hand from the Actions tab (on main or a PR branch) while nothing is deployed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: allinone
          load: true
          tags: semestra-allinone:e2e
          cache-from: type=gha,scope=allinone
          cache-to: type=gha,scope=allinone,mode=max,ignore-error=true
      - name: Start the container
        run: |
          docker run -d --name semestra -p 8000:8000 \
            -e SEMESTRA_AUTO_SECRETS=true \
            -e SEMESTRA_PUBLIC_WEB_ORIGIN=http://localhost:8000 \
            -e SEMESTRA_PUBLIC_API_ORIGIN=http://localhost:8000 \
            -e 'SEMESTRA_CORS_ORIGINS=["http://localhost:8000"]' \
            semestra-allinone:e2e
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then exit 0; fi
            sleep 2
          done
          docker logs semestra
          exit 1
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @semestra/web exec playwright install --with-deps chromium
      - run: pnpm --filter @semestra/web e2e
        env:
          E2E_BASE_URL: http://localhost:8000
      - if: failure()
        run: docker logs semestra
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
