[project]
name = "semestra-api"
version = "1.0.0"
description = "Semestra-Next backend (FastAPI)"
requires-python = ">=3.15.0"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "genai-prices>=0.1.13",
    "httptools>=0.9.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[anthropic,google,openai]==2.57.0",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=0.3.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sentry-sdk>=2.72.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "watchfiles>=1.3.0",
    "websockets>=16.0",
]

[project.scripts]
semestra = "semestra.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "semestra"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
markers = ["live: hits real external services; skipped in CI"]
addopts = "-m 'not live' -p semestra.testing"
filterwarnings = [
    # Third-party code that Python 3.15 flags for removal in 3.17; nothing for us to change.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
    "ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning:pymupdf",
]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "basic"
strict = ["src/semestra/core"]
venvPath = "."
venv = ".venv"
