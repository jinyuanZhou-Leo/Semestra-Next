# Recommended model per provider and purpose (M06 §4 step 2): used when a user has a provider that
# can serve a purpose but has not picked a model for it. Users can always pick another model.
# Kinds without an entry for a purpose (e.g. openai_compatible) need an explicit assignment.

[anthropic]
chat = "claude-sonnet-5-5"
extraction = "claude-sonnet-5-5"
vision = "claude-sonnet-5-5"
ocr = "claude-haiku-5-5"
title = "claude-haiku-5-5"

[openai]
chat = "gpt-5"
extraction = "gpt-5-mini"
vision = "gpt-5-mini"
ocr = "gpt-5-nano"
title = "gpt-5-nano"
embedding = "text-embedding-3-small"

[gemini]
chat = "gemini-2.5-pro"
extraction = "gemini-2.5-flash"
vision = "gemini-2.5-flash"
ocr = "gemini-2.5-flash-lite"
title = "gemini-2.5-flash-lite"
embedding = "gemini-embedding-001"

[ollama]
chat = "qwen3:8b"
extraction = "qwen3:8b"
title = "qwen3:8b"
embedding = "nomic-embed-text"

# Context window in tokens by model-name prefix (longest prefix wins). `extract` splits long
# documents to stay well inside it; unknown models get `default`.
[context_window]
default = 32000
"claude-" = 200000
"gpt-5" = 400000
"gpt-4.1" = 1000000
"gpt-4o" = 128000
"o3" = 200000
"o4" = 200000
"gemini-" = 1000000
"deepseek" = 128000
"qwen" = 32000
"llama3" = 128000

# How to embed with a provider's model, by model-name prefix (longest wins, matched without a
# `vendor/` prefix or an Ollama `:tag`). Open retrieval models expect a different prefix on
# queries and documents; `dimensions` asks models that support shorter vectors (Matryoshka) for
# fewer: 768 of Gemini's 3072 search almost as well at a quarter of the storage and scan time.
# Gemini's task type (query or document) is set by the client itself. Changing an entry changes
# the vector space, so the vectors are rebuilt.
[embedding_profiles."gemini-embedding"]
dimensions = 768

[embedding_profiles."nomic-embed-text"]
query_prefix = "search_query: "
document_prefix = "search_document: "

[embedding_profiles."mxbai-embed-large"]
query_prefix = "Represent this sentence for searching relevant passages: "

[embedding_profiles."snowflake-arctic-embed"]
query_prefix = "Represent this sentence for searching relevant passages: "

[embedding_profiles."embeddinggemma"]
query_prefix = "task: search result | query: "
document_prefix = "title: none | text: "

[embedding_profiles."multilingual-e5"]
query_prefix = "query: "
document_prefix = "passage: "

[embedding_profiles."e5-"]
query_prefix = "query: "
document_prefix = "passage: "

[embedding_profiles."qwen3-embedding"]
query_prefix = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
